[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wangdian-sdk"
version = "0.1.0"
description = "WangDian inventory dashboard, synchronization, reports, and Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "WangDian SDK contributors" }]
dependencies = ["requests>=2.28,<3", "openpyxl>=3.1,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://open.wangdian.cn/Y/open/apidoc"

[project.scripts]
wangdian-inventory = "wangdian_inventory.app:main"
wangdian-api = "wangdian_inventory.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wangdian_inventory = ["templates/*.html", "static/*.css", "static/*.js"]
